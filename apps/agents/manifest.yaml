              key: token
              name: github-token
        image: registry.ide-newton.ts.net/lab/agents-shell:kargo-sha-bbbaa168c46e6e167a5775d0f516789b13dc689d-run-33299054716@sha256:512cfa77ea99d535038b4d552f147a63b6941b3d16321f0aaa76ef03c9aa14e8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: "/healthz"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        name: agents-shell
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: "/readyz"
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits: {}
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: "/workspace"
          name: workspace
      initContainers:
      - args:
        - |
          set -euo pipefail

          export HOME=/tmp/git-home
          mkdir -p "${HOME}" "$(dirname "${GIT_TARGET_PATH}")" /workspace/.agents-shell

          if [[ -n "${GIT_TOKEN:-}" ]]; then
            umask 077
            printf 'https://x-access-token:%s@github.com\n' "${GIT_TOKEN}" > /tmp/git-credentials
            git config --global credential.helper 'store --file=/tmp/git-credentials'
          fi

          fetch_args=()
          clone_args=()
          if [[ "${GIT_DEPTH}" != "0" ]]; then
            fetch_args=(--depth="${GIT_DEPTH}")
            clone_args=(--depth="${GIT_DEPTH}")
          fi

          clone_checkout() {
            rm -rf "${GIT_TARGET_PATH}"
            git clone "${clone_args[@]}" --branch="${GIT_BRANCH}" "${GIT_REPOSITORY}" "${GIT_TARGET_PATH}"
          }

          preserve_checkout() {
            local reason="$1"
            local backup_root="/workspace/.agents-shell/checkouts"
            local backup_path="${backup_root}/$(basename "${GIT_TARGET_PATH}")-$(date -u +%Y%m%dT%H%M%SZ)"

            mkdir -p "${backup_root}"
            if [[ -e "${backup_path}" ]]; then
              backup_path="${backup_path}-${RANDOM}"
            fi

            echo "preserving existing workspace checkout at ${backup_path}: ${reason}" >&2
            mv "${GIT_TARGET_PATH}" "${backup_path}"
          }

          if [[ -d "${GIT_TARGET_PATH}/.git" ]]; then
            git -C "${GIT_TARGET_PATH}" remote set-url origin "${GIT_REPOSITORY}"
            if [[ "${GIT_DEPTH}" == "0" ]] && [[ "$(git -C "${GIT_TARGET_PATH}" rev-parse --is-shallow-repository 2>/dev/null)" == "true" ]]; then
              git -C "${GIT_TARGET_PATH}" fetch --unshallow origin "${GIT_BRANCH}" || git -C "${GIT_TARGET_PATH}" fetch origin "${GIT_BRANCH}"
            else
              git -C "${GIT_TARGET_PATH}" fetch "${fetch_args[@]}" origin "${GIT_BRANCH}"
            fi
            if timeout 60s git -C "${GIT_TARGET_PATH}" diff --quiet && timeout 60s git -C "${GIT_TARGET_PATH}" diff --cached --quiet; then
              git -C "${GIT_TARGET_PATH}" checkout -B "${GIT_BRANCH}" FETCH_HEAD
              git -C "${GIT_TARGET_PATH}" reset --hard FETCH_HEAD
            else
              preserve_checkout "local changes or git dirty-check timeout"
              clone_checkout
            fi
          elif [[ -e "${GIT_TARGET_PATH}" && -n "$(find "${GIT_TARGET_PATH}" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            preserve_checkout "target exists and is not an empty git checkout"
            clone_checkout
          else
            clone_checkout
          fi

          git -C "${GIT_TARGET_PATH}" remote set-url origin "${GIT_REPOSITORY}"
          git -C "${GIT_TARGET_PATH}" config user.name "Greg Konush"
          git -C "${GIT_TARGET_PATH}" config user.email "greg@proompteng.ai"
          rm -f /tmp/git-credentials
        command:
        - "/bin/bash"
        - "-ec"
        env:
        - name: GIT_REPOSITORY
          value: https://github.com/proompteng/lab.git
        - name: GIT_BRANCH
          value: main
        - name: GIT_TARGET_PATH
          value: "/workspace/lab"
        - name: GIT_DEPTH
          value: '0'
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-token
        image: registry.ide-newton.ts.net/lab/agents-shell:kargo-sha-bbbaa168c46e6e167a5775d0f516789b13dc689d-run-33299054716@sha256:512cfa77ea99d535038b4d552f147a63b6941b3d16321f0aaa76ef03c9aa14e8
