kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: codex-auth
  namespace: agents
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: codex-auth/auth.json
      metadataPolicy: None
      nullBytePolicy: Ignore
    secretKey: auth.json
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: codex-auth
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: agents-shell
    app.kubernetes.io/instance: agents
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: agents
    app.kubernetes.io/version: 0.9.0
    helm.sh/chart: agents-0.9.29
  name: agents-shell
  namespace: agents
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: http
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agents-shell
      app.kubernetes.io/instance: agents
      app.kubernetes.io/name: agents-shell
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-tailscale-ingress
  namespace: agents
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
    ports:
    - port: http
      protocol: TCP
    - port: grpc
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: http
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: agents
      app.kubernetes.io/name: agents
  policyTypes:
  - Ingress
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: agents-artifacts
  namespace: agents
spec:
  bucketName: agents-artifacts
  storageClassName: rook-ceph-bucket
---
apiVersion: orchestration.proompteng.ai/v1alpha1
kind: Orchestration
metadata:
  name: agents-primitives
  namespace: agents
spec:
  entrypoint: main
  steps:
  - agentRef:
      name: agents-primitives-agent
    kind: AgentRun
    name: agent-run
    with:
      base: main
      head: codex/issue-2425-6cedebf4
      repository: proompteng/lab
      stage: implementation
  - dependsOn:
    - agent-run
    kind: ToolRun
    name: tool-run
    toolRef:
      name: agents-primitives-tool
    with:
      action: validate
  - dependsOn:
    - tool-run
    kind: MemoryOp
    memoryRef: agents-primitives
    name: memory-op
    with:
      operation: write
      payload: '{"event":"memory-op"}'
  - dependsOn:
    - memory-op
    kind: ApprovalGate
    name: approval-gate
    policyRef: agents-primitives-approval
  - dependsOn:
    - approval-gate
    kind: SignalWait
    name: signal-wait
    with:
      deliveryId: agents-primitives-delivery
      signalRef: agents-primitives-signal
  - dependsOn:
    - signal-wait
    kind: Checkpoint
    memoryRef: agents-primitives
    name: checkpoint
    with:
      checkpointId: cp-001
      payload: '{"checkpoint":"cp-001"}'
  - dependsOn:
    - checkpoint
    kind: SubOrchestration
    name: sub-orchestration
    orchestrationRef:
      name: agents-primitives-sub
    with:
      parameters: '{"message":"hello"}'
---
apiVersion: orchestration.proompteng.ai/v1alpha1
kind: Orchestration
metadata:
  name: agents-primitives-sub
  namespace: agents
spec:
  entrypoint: main
  steps:
  - kind: ToolRun
    name: echo
    toolRef:
      name: agents-primitives-tool
    with:
      action: sub-orchestration
---
apiVersion: orchestration.proompteng.ai/v1alpha1
kind: Orchestration
metadata:
  labels:
    app.kubernetes.io/component: codex-runtime
    app.kubernetes.io/name: agents
  name: codex-rerun
  namespace: agents
spec:
  entrypoint: implement
  steps:
  - agentRef:
      name: codex-agent
    kind: AgentRun
    name: implement
    with:
      goal: '{"objective":"{{codexPrompt}}","tokenBudget":250000}'
      implementation: |-
        {
          "summary": "Codex rerun for {{repository}} on {{head}}",
          "text": "{{codexPrompt}}",
          "source": {
            "provider": "codex",
            "externalId": "{{repository}}:{{head}}",
            "url": "{{issueUrl}}"
          },
          "contract": {
            "requiredKeys": ["repository", "base", "head", "stage"]
          },
          "metadata": {
            "stage": "implementation"
          }
        }
      policy: '{"secretBindingRef":"codex-github-token"}'
      runtime: '{"type":"job","config":{"serviceAccountName":"agents-sa"}}'
      secrets: '["github-token","codex-auth"]'
      ttlSecondsAfterFinished: '86400'
      vcsPolicy: '{"required":true,"mode":"read-write"}'
      vcsRef: github
---
apiVersion: orchestration.proompteng.ai/v1alpha1
kind: Orchestration
metadata:
  labels:
    app.kubernetes.io/component: codex-runtime
    app.kubernetes.io/name: agents
  name: codex-system-improvement
  namespace: agents
spec:
  entrypoint: implement
  steps:
  - agentRef:
      name: codex-agent
    kind: AgentRun
    name: implement
    with:
      goal: '{"objective":"{{codexPrompt}}","tokenBudget":250000}'
      implementation: |-
        {
          "summary": "Codex system improvement for {{repository}} on {{head}}",
          "text": "{{codexPrompt}}",
          "source": {
            "provider": "codex",
            "externalId": "{{repository}}:{{head}}",
            "url": "{{issueUrl}}"
          },
          "contract": {
            "requiredKeys": ["repository", "base", "head", "stage"]
          },
          "metadata": {
            "stage": "implementation",
            "kind": "system-improvement"
          }
        }
      policy: '{"secretBindingRef":"codex-github-token"}'
      runtime: '{"type":"job","config":{"serviceAccountName":"agents-sa"}}'
      secrets: '["github-token","codex-auth"]'
      ttlSecondsAfterFinished: '86400'
      vcsPolicy: '{"required":true,"mode":"read-write"}'
      vcsRef: github
---
apiVersion: orchestration.proompteng.ai/v1alpha1
kind: OrchestrationRun
metadata:
  name: agents-primitives-run
  namespace: agents
spec:
  orchestrationRef:
    name: agents-primitives
  parameters:
    runId: agents-primitives-run
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: agents-db-next
  namespace: agents
spec:
  bootstrap:
    initdb:
      dataChecksums: true
      database: agents
      encoding: UTF8
      owner: agents
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;
      - CREATE EXTENSION IF NOT EXISTS pgcrypto;
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: pgadmin
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: pgadmin
  instances: 1
  primaryUpdateStrategy: unsupervised
  storage:
    size: 50Gi
    storageClass: rook-ceph-block
