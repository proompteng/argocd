          value: https://auth.proompteng.ai/realms/master
        - name: AGENTS_SHELL_RESOURCE
          value: https://agents-shell.proompteng.ai
        - name: AGENTS_SHELL_WORKSPACE_ROOT
          value: "/workspace"
