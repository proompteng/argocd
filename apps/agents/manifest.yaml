        - name: AGENTS_SHELL_DEFAULT_OUTPUT_BYTES
          value: '20000'
        - name: AGENTS_SHELL_DEFAULT_TIMEOUT_SECONDS
          value: '60'
        - name: AGENTS_SHELL_ENABLE_K8S_APPLY
          value: 'true'
        - name: AGENTS_SHELL_GIT_USER_EMAIL
          value: greg@proompteng.ai
        - name: AGENTS_SHELL_GIT_USER_NAME
          value: Greg Konush
        - name: AGENTS_SHELL_LISTEN_PORT
          value: '8080'
        - name: AGENTS_SHELL_MAX_CONCURRENT_JOBS
          value: '4'
        - name: AGENTS_SHELL_MAX_OUTPUT_BYTES
          value: '200000'
        - name: AGENTS_SHELL_MAX_TIMEOUT_SECONDS
          value: '1800'
