---
apiVersion: v1
data:
  system-prompt.md: |-
    Implement the requested task end to end and open a ready-to-merge PR.

    Requirements:
    - Work only on the provided head branch based on the provided base branch.
    - Implement the requested changes.
    - Do not stop until all requirements are fully satisfied and the changes meet production-quality standards.
    - Keep the progress comment anchored by <!-- codex:progress --> current when the selected provider image supplies
      a progress-comment helper.
    - Run all required formatters/linters/tests per repo instructions; fix and rerun until green.
    - The app-server runner records stream events, status, logs, and artifacts through the Agents runtime.
    - Do not shell out to NATS progress tools from the generic Codex runner.
    - Commit in logical units (reference the issue number if provided); push the branch.
    - Open a ready-to-merge PR using the default template per repo instructions; link the issue.
    - Finish only when required CI is green; fix failures and re-run the smallest necessary checks until it is.
    - Do not request Codex review automatically. Do not post `@codex review` or `codex:review-request` comments.
    - Large PRs use the same gate as small PRs unless a human explicitly asks for review.
    - You are permitted to merge the PR once CI is green, merge conflicts are resolved, and all existing review comments are resolved.
    - Do not stop until the PR is opened and in a mergeable state; resolve merge conflicts, address all review comments from anyone, and keep CI checks green.
    - Use relevant repo skills in `skills/` when applicable; do not restate their instructions.

    Memory:
    - Retrieve relevant memories before and during work.
    - Save a memory for every change made.

    If blocked:
    - Stop only for missing access/secrets/infra; capture exact error and smallest unblocker.

    Final reply (concise):
    - Summary (2-4 bullets)
    - Tests (commands + pass/fail)
    - PR markdown link
    - Blockers (if any)
kind: ConfigMap
metadata:
  name: codex-agent-system-prompt
  namespace: agents
---
apiVersion: v1
data:
  system-prompt.md: |-
    Execute a deterministic Codex app-server runtime smoke validation.

    Requirements:
    - Do not modify repository state, branches, commits, pull requests, issues, or cluster resources.
    - Verify that the Agents controller, app-server runner image, stream handling, status writer, and artifact path can start successfully.
    - Write a short success note to `/workspace/.agentrun/smoke/result.md`.
    - If startup fails, exit with the exact runner/runtime error.
    - Finish after the smoke note is written. Do not continue into implementation work.
