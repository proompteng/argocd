apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    serving.knative.dev/creator: system:serviceaccount:argocd:argocd-application-controller
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: torghut
    app.kubernetes.io/part-of: lab
    networking.knative.dev/visibility: cluster-local
  name: torghut
  namespace: torghut
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '1'
        autoscaling.knative.dev/target: '80'
        client.knative.dev/updateTimestamp: '2026-08-29T22:16:07Z'
    spec:
      containerConcurrency: 0
      containers:
      - env:
        - name: TORGHUT_PROCESS_ROLE
          value: api
        - name: TRADING_SCHEDULER_RUNTIME_BASE_URL
          value: http://torghut-scheduler.torghut.svc.cluster.local:8183
        - name: TRADING_SCHEDULER_RUNTIME_TIMEOUT_SECONDS
          value: '2'
        - name: TRADING_SCHEDULER_SHUTDOWN_DRAIN_SECONDS
          value: '45'
        - name: TRADING_SCHEDULER_SUCCESS_MAX_AGE_SECONDS
          value: '30'
        - name: TRADING_BROKER_MUTATION_RECOVERY_ENABLED
          value: 'true'
        - name: TRADING_BROKER_MUTATION_HTTP_TIMEOUT_SECONDS
          value: '10'
        - name: APP_ENV
          value: prod
        - name: LOG_LEVEL
          value: INFO
        - name: LOG_FORMAT
          value: json
        - name: LOG_ACCESS_LOG
          value: 'true'
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              key: uri
              name: torghut-db-app
        - name: TORGHUT_SIM_DB_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: torghut-db-app
        - name: TORGHUT_SIM_DB_PORT
          valueFrom:
            secretKeyRef:
              key: port
              name: torghut-db-app
        - name: TORGHUT_SIM_DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: torghut-db-app
        - name: TORGHUT_SIM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: torghut-db-app
        - name: SIM_DB_DSN
          value: postgresql://$(TORGHUT_SIM_DB_USER):$(TORGHUT_SIM_DB_PASSWORD)@$(TORGHUT_SIM_DB_HOST):$(TORGHUT_SIM_DB_PORT)/torghut_sim_default
        - name: TORGHUT_TIGERBEETLE_ENABLED
          value: 'true'
        - name: TORGHUT_TIGERBEETLE_REQUIRED
          value: 'true'
        - name: TORGHUT_TIGERBEETLE_CLUSTER_ID
          value: '2001'
        - name: TORGHUT_TIGERBEETLE_REPLICA_ADDRESSES
          value: torghut-tigerbeetle.torghut.svc.cluster.local:3000
        - name: TORGHUT_TIGERBEETLE_HEALTH_TIMEOUT_SECONDS
          value: '5'
        - name: TORGHUT_TIGERBEETLE_RPC_TIMEOUT_SECONDS
          value: '10'
        - name: TORGHUT_TIGERBEETLE_JOURNAL_ENABLED
          value: 'true'
        - name: TORGHUT_TIGERBEETLE_RECONCILE_REQUIRED
          value: 'false'
        - name: TORGHUT_TIGERBEETLE_ECONOMIC_PARITY_REQUIRED
          value: 'true'
        - name: APCA_API_KEY_ID
          valueFrom:
            secretKeyRef:
              key: APCA_API_KEY_ID
              name: torghut-alpaca
              optional: true
        - name: APCA_API_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: APCA_API_SECRET_KEY
              name: torghut-alpaca
              optional: true
        - name: APCA_API_BASE_URL
          valueFrom:
            secretKeyRef:
              key: APCA_API_BASE_URL
              name: torghut-alpaca
              optional: true
        - name: CLICKHOUSE_HOST
          value: torghut-clickhouse.torghut.svc.cluster.local
        - name: CLICKHOUSE_PORT
          value: '8123'
        - name: CLICKHOUSE_DATABASE
          value: torghut
        - name: CLICKHOUSE_USERNAME
          value: torghut
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: torghut_password
              name: torghut-clickhouse-auth
        - name: CLICKHOUSE_SECURE
          value: 'false'
        - name: CLICKHOUSE_TIMEOUT_SECONDS
          value: '10'
        - name: TRADING_ENABLED
          value: 'false'
        - name: TRADING_PIPELINE_MODE
          value: simple
        - name: TRADING_SIMPLE_SUBMIT_ENABLED
          value: 'true'
        - name: TRADING_LIVE_SUBMIT_ENABLED
          value: 'true'
        - name: TRADING_SIMPLE_ORDER_FEED_TELEMETRY_ENABLED
          value: 'true'
        - name: TRADING_SIMPLE_MAX_ORDER_PCT_EQUITY
          value: '0.50'
        - name: TRADING_SIMPLE_MAX_SYMBOL_PCT_EQUITY
          value: '0.50'
        - name: TRADING_SIMPLE_MAX_GROSS_EXPOSURE_PCT_EQUITY
          value: '1.0'
        - name: TRADING_SIMPLE_MAX_NET_EXPOSURE_PCT_EQUITY
          value: '0.50'
        - name: TRADING_SIMPLE_BUYING_POWER_RESERVE_BPS
          value: '1000'
        - name: TRADING_MAX_POSITION_PCT_EQUITY
          value: '0.50'
        - name: TRADING_ALLOCATOR_ENABLED
          value: 'true'
        - name: TRADING_ALLOCATOR_MAX_SYMBOL_PCT_EQUITY
          value: '0.50'
        - name: TRADING_PORTFOLIO_MAX_GROSS_EXPOSURE_PCT_EQUITY
