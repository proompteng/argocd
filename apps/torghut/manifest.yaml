            <asynchronous_metrics>true</asynchronous_metrics>
          </prometheus>
        </yandex>
      users.d/99-profile-overrides.xml: |-
        <yandex>
          <profiles>
            <default>
              <!-- Disable sampling profiler logs to keep system tables small. -->
              <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
              <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
              <log_profile_events>0</log_profile_events>
            </default>
          </profiles>
        </yandex>
    profiles:
      bayn/max_execution_time: 60
      bayn/max_memory_usage: 2147483648
      bayn/max_result_rows: 1000000
      bayn/max_threads: 4
      bayn/readonly: 1
