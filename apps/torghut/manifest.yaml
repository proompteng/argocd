apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: torghut-db
  namespace: torghut
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - amd64
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-torghut
      endpointURL: http://rook-ceph-rgw-objectstore.rook-ceph.svc.cluster.local:80
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: cnpg-torghut-db
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: cnpg-torghut-db
      serverName: torghut-db-live
      wal:
        maxParallel: 8
    retentionPolicy: 14d
    target: prefer-standby
  bootstrap:
    initdb:
      dataChecksums: true
      database: torghut
      encoding: UTF8
      owner: torghut_app
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: pgadmin,jangar,argo-workflows
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: pgadmin,jangar,argo-workflows
  instances: 2
  managed:
    roles:
    - comment: Read-only Torghut diagnostics notebooks
      connectionLimit: 4
      ensure: present
      inRoles:
      - pg_read_all_data
      inherit: true
      login: true
      name: torghut_notebook
      passwordSecret:
        name: torghut-notebook-postgres
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      wal_buffers: 16MB
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: '4'
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 1Gi
  storage:
    size: 50Gi
    storageClass: rook-ceph-block
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: torghut-db-daily
  namespace: torghut
spec:
  backupOwnerReference: self
  cluster:
    name: torghut-db
  method: barmanObjectStore
  schedule: 0 0 2 * * *
