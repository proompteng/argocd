apiVersion: tigerbeetle.proompteng.ai/v1alpha1
kind: TigerBeetleCluster
metadata:
  labels:
    app.kubernetes.io/name: torghut-tigerbeetle
    app.kubernetes.io/part-of: torghut
  name: torghut-tigerbeetle
  namespace: torghut
spec:
  clusterID: '2001'
  health:
    checkIntervalSeconds: 5
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/tigerbeetle/tigerbeetle
    tag: 0.17.9
  nodeSelector:
    kubernetes.io/arch: arm64
  pdb:
    enabled: true
    minAvailable: 1
  replicas: 1
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: '2'
      memory: 4Gi
  storage:
    className: rook-ceph-block
    size: 100Gi
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: torghut-flink-private
  namespace: torghut
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`flink.k8s.proompteng.ai`)
    services:
    - name: torghut-ta-rest
      port: 8081
  tls:
    secretName: wildcard-k8s-proompteng-ai-tls
