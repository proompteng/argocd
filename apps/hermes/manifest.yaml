  backup-once.sh: |
    #!/bin/sh
    set -eu

    backup_dir=${HERMES_BACKUP_DIR:-/opt/backups}
    retention_count=${HERMES_BACKUP_RETENTION_COUNT:-14}
    stamp=$(date -u +%Y%m%dT%H%M%SZ)
    archive_name="hermes-backup-$stamp.zip"
    archive="$backup_dir/$archive_name"
    pending_archive="$backup_dir/.hermes-backup-$stamp.zip"
    pending_checksum="$archive.sha256.pending"
    pending_marker="$backup_dir/.last-success.pending"
    completed=false

    cleanup() {
      rm -f -- "$pending_archive" "$pending_checksum" "$pending_marker"
      if [ "$completed" != true ]; then
        rm -f -- "$archive" "$archive.sha256"
      fi
    }
    trap cleanup EXIT HUP INT TERM

    mkdir -p "$backup_dir" "${HOME:-/tmp/home}"
    if backup_output=$(/opt/hermes/.venv/bin/hermes backup --output "$pending_archive" 2>&1); then
      printf '%s\n' "$backup_output"
    else
      backup_status=$?
      printf '%s\n' "$backup_output" >&2
      exit "$backup_status"
    fi
    case "$backup_output" in
      *"SQLite safe copy failed"*|*"Raw copy also failed"*|*"Warnings ("*)
        echo 'Hermes backup reported an unsafe or incomplete database copy' >&2
        exit 1
        ;;
    esac
    unset backup_output backup_status

    /opt/hermes/.venv/bin/python - "$pending_archive" <<'PY'
    import shutil
    import sqlite3
    import sys
    import tempfile
    import zipfile
    from pathlib import Path

    archive = sys.argv[1]
    database_count = 0
    with zipfile.ZipFile(archive) as backup:
        corrupt_entry = backup.testzip()
        if corrupt_entry is not None:
            raise RuntimeError(f"corrupt zip entry: {corrupt_entry}")
        for entry in (candidate for candidate in backup.infolist() if candidate.filename.endswith(".db")):
            with tempfile.NamedTemporaryFile(dir=Path(archive).parent, suffix=".db") as extracted:
                with backup.open(entry) as source:
                    shutil.copyfileobj(source, extracted)
                extracted.flush()
                connection = sqlite3.connect(f"file:{extracted.name}?mode=ro", uri=True)
                results = [row[0] for row in connection.execute("PRAGMA quick_check")]
                connection.close()
                if results != ["ok"]:
                    raise RuntimeError(f"SQLite integrity check failed: {entry.filename}")
            database_count += 1
    if database_count == 0:
        raise RuntimeError("backup contains no SQLite databases")
    print(f"Verified {database_count} SQLite database snapshot(s)")
    PY

    pending_digest=$(sha256sum "$pending_archive")
    expected_digest=${pending_digest%% *}
    printf '%s  %s\n' "$expected_digest" "$archive_name" >"$pending_checksum"
    printf '%s  %s\n' "$expected_digest" "$pending_archive" | sha256sum -c -
    mv -- "$pending_checksum" "$archive.sha256"
    mv -- "$pending_archive" "$archive"
    (cd "$backup_dir" && sha256sum -c "$archive_name.sha256")

    find "$backup_dir" -maxdepth 1 -type f -name 'hermes-backup-*.zip' -print \
      | sort -r \
      | tail -n "+$((retention_count + 1))" \
      | while IFS= read -r expired; do
        rm -f -- "$expired" "$expired.sha256"
      done

    printf '%s\n' "$stamp" >"$pending_marker"
    mv -- "$pending_marker" "$backup_dir/last-success"
    completed=true
    printf 'Hermes backup completed and verified: %s\n' "$(basename "$archive")"
  bootstrap-github.sh: |
    #!/bin/sh
    set -eu

    umask 077

    gh_version=${GH_CLI_VERSION:-2.96.0}
    gh_archive_name="gh_${gh_version}_linux_amd64.tar.gz"
    gh_archive_sha256=${GH_CLI_ARCHIVE_SHA256:-83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60}
    gh_archive_url=${GH_CLI_ARCHIVE_URL:-https://github.com/cli/cli/releases/download/v${gh_version}/${gh_archive_name}}
    gh_cache_dir=${GH_CLI_CACHE_DIR:-${HOME:?HOME is required}/.cache/hermes-tools}
    gh_install_path=${GH_CLI_INSTALL_PATH:-/opt/tools/gh}
    gh_config_dir=${GH_CONFIG_DIR:?GH_CONFIG_DIR is required}
    gh_hosts_path=${gh_config_dir}/hosts.yml
    gh_cli_config_path=${gh_config_dir}/config.yml
    gh_auth_stage_dir=${gh_config_dir}/.bootstrap.$$
    git_config_path=${HERMES_GIT_CONFIG_PATH:-${HOME}/.gitconfig}
    python_bin=${HERMES_PYTHON_BIN:-/opt/hermes/.venv/bin/python}
    archive_path=${gh_cache_dir}/${gh_archive_name}
    archive_tmp=${archive_path}.tmp.$$
    extract_dir=${TMPDIR:-/tmp}/hermes-gh.$$
    git_config_tmp=${git_config_path}.tmp.$$

    case "$gh_version" in
      ''|*[!0-9.]*|.*|*.)
        echo "invalid GitHub CLI version: $gh_version" >&2
        exit 1
        ;;
    esac
    case "$gh_archive_sha256" in
      *[!0-9a-f]*|'')
        echo 'invalid GitHub CLI archive checksum' >&2
        exit 1
        ;;
    esac
    if [ "${#gh_archive_sha256}" -ne 64 ]; then
      echo 'invalid GitHub CLI archive checksum length' >&2
      exit 1
    fi

    cleanup() {
      rm -f -- "$archive_tmp" "$git_config_tmp"
      rm -rf -- "$extract_dir" "$gh_auth_stage_dir"
    }
    trap cleanup EXIT HUP INT TERM

    gh_install_dir=$(dirname "$gh_install_path")
    install -d -m 0700 "$gh_cache_dir" "$(dirname "$git_config_path")"
    if [ ! -d "$gh_install_dir" ]; then
      install -d -m 0700 "$gh_install_dir"
    fi
    if [ ! -w "$gh_install_dir" ]; then
      echo "GitHub CLI install directory is not writable: $gh_install_dir" >&2
      exit 1
    fi
    if [ ! -d "$gh_config_dir" ]; then
      install -d -m 0700 "$gh_config_dir"
    fi
    if [ ! -w "$gh_config_dir" ]; then
      echo "GitHub CLI config directory is not writable: $gh_config_dir" >&2
      exit 1
    fi
    if [ -z "${GH_TOKEN:-}" ]; then
      echo 'GH_TOKEN is required for GitHub CLI bootstrap' >&2
      exit 1
    fi
    # This volume is per-Pod and the gateway has not started yet. Clear any file
    # left by a failed init attempt so GitHub CLI never tries to migrate a
    # partially initialized or read-only auth file on retry.
    rm -f -- "$gh_hosts_path" "$gh_cli_config_path"

    archive_is_valid() {
      [ -f "$archive_path" ] && printf '%s  %s\n' "$gh_archive_sha256" "$archive_path" | sha256sum -c - >/dev/null 2>&1
    }

    if ! archive_is_valid; then
      rm -f -- "$archive_path" "$archive_tmp"
      "$python_bin" - "$gh_archive_url" "$archive_tmp" <<'PY'
    import os
    import pathlib
    import sys
    import urllib.request

    url, destination = sys.argv[1:]
    maximum_bytes = 128 * 1024 * 1024
    request = urllib.request.Request(url, headers={"User-Agent": "hermes-github-bootstrap/1"})
    written = 0
    with urllib.request.urlopen(request, timeout=120) as response:
        if response.status not in (None, 200):
            raise RuntimeError(f"GitHub CLI download returned HTTP {response.status}")
        with pathlib.Path(destination).open("xb") as target:
            while chunk := response.read(1024 * 1024):
                written += len(chunk)
                if written > maximum_bytes:
                    raise RuntimeError("GitHub CLI archive exceeds the 128 MiB limit")
                target.write(chunk)
            target.flush()
            os.fsync(target.fileno())
    if written == 0:
        raise RuntimeError("GitHub CLI download was empty")
    PY
      printf '%s  %s\n' "$gh_archive_sha256" "$archive_tmp" | sha256sum -c - >/dev/null
      mv -- "$archive_tmp" "$archive_path"
    fi

    printf '%s  %s\n' "$gh_archive_sha256" "$archive_path" | sha256sum -c - >/dev/null
    install -d -m 0700 "$extract_dir"
    "$python_bin" - "$archive_path" "$extract_dir/gh" "$gh_version" <<'PY'
    import pathlib
    import shutil
    import sys
    import tarfile

    archive_path, destination_path, version = sys.argv[1:]
    member_name = f"gh_{version}_linux_amd64/bin/gh"
    with tarfile.open(archive_path, "r:gz") as archive:
        member = archive.getmember(member_name)
        if not member.isfile() or member.size <= 0 or member.size > 128 * 1024 * 1024:
            raise RuntimeError("GitHub CLI archive contains an invalid gh binary")
        source = archive.extractfile(member)
        if source is None:
            raise RuntimeError("GitHub CLI binary could not be extracted")
        with source, pathlib.Path(destination_path).open("xb") as destination:
            shutil.copyfileobj(source, destination)
    PY
    install -m 0555 "$extract_dir/gh" "$gh_install_path"
    "$gh_install_path" --version | grep -F "gh version $gh_version" >/dev/null

    install -d -m 0700 "$gh_auth_stage_dir"
    printf '%s' "$GH_TOKEN" | env -u GH_TOKEN -u GITHUB_TOKEN \
      GH_CONFIG_DIR="$gh_auth_stage_dir" GH_PROMPT_DISABLED=1 \
      "$gh_install_path" auth login \
        --hostname github.com \
        --git-protocol https \
        --with-token \
        --insecure-storage
    if [ ! -s "$gh_auth_stage_dir/hosts.yml" ]; then
      echo 'GitHub CLI did not create its authentication file' >&2
      exit 1
    fi
    if [ ! -s "$gh_auth_stage_dir/config.yml" ]; then
      echo 'GitHub CLI did not create its configuration file' >&2
      exit 1
    fi
    chmod 0600 "$gh_auth_stage_dir/hosts.yml" "$gh_auth_stage_dir/config.yml"
    github_login=$(env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$gh_auth_stage_dir" \
      "$gh_install_path" api user --jq .login)
    if [ "$github_login" != tuslagch ]; then
      echo "GitHub CLI authenticated as unexpected account: $github_login" >&2
      exit 1
    fi
    github_permission=$(env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$gh_auth_stage_dir" \
      "$gh_install_path" repo view proompteng/lab --json viewerPermission --jq .viewerPermission)
    if [ "$github_permission" != ADMIN ]; then
      echo "tuslagch lacks ADMIN permission on proompteng/lab: $github_permission" >&2
      exit 1
    fi
    mv -f -- "$gh_auth_stage_dir/config.yml" "$gh_cli_config_path"
    mv -f -- "$gh_auth_stage_dir/hosts.yml" "$gh_hosts_path"
    rm -rf -- "$gh_auth_stage_dir"

    : >"$git_config_tmp"
    chmod 0600 "$git_config_tmp"
    git config --file "$git_config_tmp" user.name tuslagch
    git config --file "$git_config_tmp" user.email 241203724+tuslagch@users.noreply.github.com
    git config --file "$git_config_tmp" init.defaultBranch main
    git config --file "$git_config_tmp" fetch.prune true
    git config --file "$git_config_tmp" pull.ff only
    git config --file "$git_config_tmp" push.default current
    git config --file "$git_config_tmp" push.autoSetupRemote true
    git config --file "$git_config_tmp" commit.gpgsign false
    git config --file "$git_config_tmp" --add credential.https://github.com.helper ''
    git config --file "$git_config_tmp" --add credential.https://github.com.helper "!$gh_install_path auth git-credential"
    git config --file "$git_config_tmp" --add credential.https://gist.github.com.helper ''
    git config --file "$git_config_tmp" --add credential.https://gist.github.com.helper "!$gh_install_path auth git-credential"
    mv -- "$git_config_tmp" "$git_config_path"

    printf 'github_bootstrap_ready=true gh_version=%s git_user=tuslagch repo_permission=ADMIN\n' "$gh_version"
  bootstrap-lab-checkout.sh: |
    #!/bin/sh
    set -eu

    umask 077
    export GIT_TERMINAL_PROMPT="${GIT_TERMINAL_PROMPT:-0}"
    export GIT_CONFIG_NOSYSTEM=1
    export GIT_CONFIG_GLOBAL=/dev/null

    repository_url=${LAB_REPOSITORY_URL:-https://github.com/proompteng/lab.git}
    checkout_ref=${LAB_CHECKOUT_REF:-main}
    checkout_dir=${LAB_CHECKOUT_DIR:-/opt/data/workspace/tuslagch/lab}
    revision_file=${LAB_CHECKOUT_REVISION_FILE:-/opt/data/workspace/tuslagch/.lab-source-revision}
    retry_attempts=${LAB_CHECKOUT_RETRY_ATTEMPTS:-5}
    retry_delay_seconds=${LAB_CHECKOUT_RETRY_DELAY_SECONDS:-2}

    case "$checkout_ref" in
      ''|*[!A-Za-z0-9._/-]*)
        echo "invalid lab checkout ref: $checkout_ref" >&2
        exit 1
        ;;
    esac
    case "$retry_attempts" in
      ''|*[!0-9]*|0)
        echo "invalid lab checkout retry attempts: $retry_attempts" >&2
        exit 1
        ;;
    esac
    if [ "$retry_attempts" -le 0 ]; then
      echo "invalid lab checkout retry attempts: $retry_attempts" >&2
      exit 1
    fi
    case "$retry_delay_seconds" in
      ''|*[!0-9]*)
        echo "invalid lab checkout retry delay: $retry_delay_seconds" >&2
        exit 1
        ;;
    esac

    if [ -L "$checkout_dir" ]; then
      echo "lab checkout path must not be a symbolic link: $checkout_dir" >&2
      exit 1
    fi

    mkdir -p "$(dirname "$checkout_dir")" "$(dirname "$revision_file")"

    retry_checkout_command() {
      operation=$1
      shift
      attempt=1
      while [ "$attempt" -le "$retry_attempts" ]; do
        if "$@"; then
          return 0
        fi
        if [ "$attempt" -lt "$retry_attempts" ]; then
          echo "warning: lab checkout $operation attempt $attempt/$retry_attempts failed; retrying in ${retry_delay_seconds}s" >&2
          sleep "$retry_delay_seconds"
        fi
        attempt=$((attempt + 1))
      done
      return 1
    }

    if [ ! -e "$checkout_dir" ]; then
      staging_dir="${checkout_dir}.clone.$$"
      cleanup_staging() {
        rm -rf -- "$staging_dir"
      }
      trap cleanup_staging EXIT HUP INT TERM
      clone_checkout() {
        rm -rf -- "$staging_dir"
        git -c protocol.version=2 clone \
          --filter=blob:none \
          --no-tags \
          --single-branch \
          --branch "$checkout_ref" \
          "$repository_url" \
          "$staging_dir"
      }
      if ! retry_checkout_command clone clone_checkout; then
        echo "could not clone lab checkout after $retry_attempts attempts" >&2
        exit 1
      fi
      mv -- "$staging_dir" "$checkout_dir"
      trap - EXIT HUP INT TERM
    elif [ ! -d "$checkout_dir/.git" ]; then
      echo "lab checkout path exists but is not a Git worktree: $checkout_dir" >&2
      exit 1
    else
      configured_remote=$(git -C "$checkout_dir" remote get-url origin)
      if [ "$configured_remote" != "$repository_url" ]; then
        echo "lab checkout origin mismatch: $configured_remote" >&2
        exit 1
      fi

      fetch_checkout() {
        git -C "$checkout_dir" fetch \
          --filter=blob:none \
          --no-tags \
          --prune \
          origin \
          "refs/heads/$checkout_ref:refs/remotes/origin/$checkout_ref"
      }
      if retry_checkout_command fetch fetch_checkout; then
        current_branch=$(git -C "$checkout_dir" symbolic-ref --quiet --short HEAD || true)
        if [ "$current_branch" = "$checkout_ref" ] && [ -z "$(git -C "$checkout_dir" status --porcelain)" ]; then
          git -C "$checkout_dir" merge --ff-only "refs/remotes/origin/$checkout_ref"
        else
          echo "preserving local lab checkout state; refreshed origin/$checkout_ref only"
        fi
      else
        echo "warning: could not refresh lab checkout; preserving the existing verified worktree" >&2
      fi
    fi

    revision=$(git -C "$checkout_dir" rev-parse HEAD)
    revision_tmp="${revision_file}.tmp.$$"
    printf '%s\n' "$revision" >"$revision_tmp"
    mv -- "$revision_tmp" "$revision_file"
    printf 'lab_checkout_ready=true revision=%s path=%s\n' "$revision" "$checkout_dir"
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    umask 077

    toolchain_bin=/opt/lab-toolchain/bin

    check_tool_version() {
      tool_name=$1
      expected_version=$2
      shift 2
      actual_version=$("$@")
      if [ "$actual_version" != "$expected_version" ]; then
        printf '%s version mismatch: expected %s, got %s\n' "$tool_name" "$expected_version" "$actual_version" >&2
        exit 1
      fi
    }

    check_tool_version node v24.11.1 "$toolchain_bin/node" --version
    check_tool_version bun 1.4.0 "$toolchain_bin/bun" --version
    check_tool_version bunx 1.4.0 "$toolchain_bin/bunx" --version
    check_tool_version go 'go version go1.25.5 linux/amd64' "$toolchain_bin/go" version
    check_tool_version helm v3.19.1 "$toolchain_bin/helm" version --template '{{.Version}}'
    check_tool_version jq jq-1.8.1 "$toolchain_bin/jq" --version
    check_tool_version kustomize v5.8.0 "$toolchain_bin/kustomize" version
    check_tool_version kubeconform v0.7.0 "$toolchain_bin/kubeconform" -v
    shellcheck_version=$("$toolchain_bin/shellcheck" --version | sed -n 's/^version: //p')
    check_tool_version shellcheck 0.11.0 printf '%s' "$shellcheck_version"
    yq_version=$("$toolchain_bin/yq" --version | sed 's/^.* version //')
    check_tool_version yq v4.49.2 printf '%s' "$yq_version"
    unset shellcheck_version yq_version

    mkdir -p \
      /opt/data/cron \
      /opt/data/home \
      /opt/data/logs \
      /opt/data/memories \
      /opt/data/pairing \
      /opt/data/platforms/pairing \
      /opt/data/plans \
      /opt/data/sessions \
      /opt/data/skills \
      /opt/data/workspace/tuslagch

    install -m 0555 /opt/kubectl-image/bin/kubectl /opt/tools/kubectl
    /opt/tools/kubectl version --client=true >/tmp/kubectl-version.log

    kubeconfig_dir=${HOME}/.kube
    kubeconfig_path=${kubeconfig_dir}/config
    kubeconfig_tmp=${kubeconfig_path}.tmp.$$
    : "${KUBERNETES_SERVICE_HOST:?Kubernetes service host is required}"
    : "${KUBERNETES_SERVICE_PORT:?Kubernetes service port is required}"
    install -d -m 0700 "$kubeconfig_dir"
    cat >"$kubeconfig_tmp" <<EOF
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: hermes
    current-context: in-cluster
    users:
      - name: hermes
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    EOF
    chmod 0600 "$kubeconfig_tmp"
    mv -- "$kubeconfig_tmp" "$kubeconfig_path"

    /bin/sh /opt/bootstrap/bootstrap-lab-checkout.sh

    seed_file() {
      source_path=$1
      destination_path=$2
      if [ ! -e "$destination_path" ]; then
        install -m 0600 "$source_path" "$destination_path"
      fi
    }

    seed_file /opt/bootstrap/USER.md /opt/data/memories/USER.md

    /opt/hermes/.venv/bin/hermes config check >/tmp/hermes-config-check.log
    exec /bin/sh /opt/bootstrap/bootstrap-github.sh
  terminal-profile.sh: |
    #!/bin/sh

    # Debian's /etc/profile replaces the container PATH for every login shell.
    # Hermes captures that login environment for terminal sessions, so reassert
    # the immutable production tool path after the system profile initializes.
    export PATH='/opt/tools:/opt/lab-toolchain/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
kind: ConfigMap
metadata:
  name: hermes-bootstrap-7bdkb6hth8
  namespace: hermes
---
apiVersion: v1
data:
  config.yaml: |
    _config_version: 33

    model:
      default: qwen36-flamingo
      provider: custom
      base_url: http://flamingo.flamingo.svc.cluster.local/v1
      api_mode: chat_completions
      context_length: 262144

    terminal:
      backend: local
      cwd: /opt/data/workspace/tuslagch/lab
      timeout: 180
      lifetime_seconds: 900
      home_mode: profile
      shell_init_files:
        - /etc/profile.d/hermes-tools.sh

    tool_loop_guardrails:
      warnings_enabled: true
      hard_stop_enabled: true
      warn_after:
        exact_failure: 2
        same_tool_failure: 3
        idempotent_no_progress: 2
      hard_stop_after:
        exact_failure: 4
        same_tool_failure: 6
        idempotent_no_progress: 4

    compression:
      enabled: true
      threshold: 0.65
      target_ratio: 0.25
      protect_last_n: 20
      protect_first_n: 1

    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 4400
      user_char_limit: 2200
      nudge_interval: 10
      flush_min_turns: 4

    session_reset:
      mode: both
      idle_minutes: 1440
      at_hour: 4

    max_concurrent_sessions: 4
    group_sessions_per_user: true

    streaming:
      enabled: false

    skills:
      creation_nudge_interval: 0

    agent:
      max_turns: 40
      gateway_timeout: 1800
      gateway_timeout_warning: 1200
      restart_drain_timeout: 90
      api_max_retries: 2
      verify_on_stop: true
      verbose: false
      reasoning_effort: medium
      coding_instructions:
        - Keep all mutable work inside /opt/data/workspace/tuslagch.
        - Treat /opt/data/workspace/tuslagch/lab as the project root and default working directory.
        - Use the authenticated tuslagch GitHub identity, codex/ branches, and pull requests for explicitly requested repository changes; never force-push or push directly to main.
        - Kubernetes access is cluster-wide read-only; never attempt to mutate resources or read Kubernetes Secrets.
        - Never claim an external action completed without a fresh readback.

    platform_toolsets:
      cli: [file, memory, terminal, todo, web, exa]
      api_server: [file, memory, terminal, todo, web, exa]
      discord: [file, memory, terminal, todo, web, exa]

    platforms:
      discord:
        enabled: true
        reply_to_mode: first
        gateway_restart_notification: false
        typing_indicator: true
      api_server:
        enabled: true
        extra:
          host: 0.0.0.0
          port: 8642
          model_name: tuslagch

    gateway:
      write_sessions_json: false
      api_server:
        max_concurrent_runs: 2

    approvals:
      mode: manual
      timeout: 90
      cron_mode: deny
      mcp_reload_confirm: true
      destructive_slash_confirm: true
      deny:
        - "*docker*"
        - "*podman*"
        - "*printenv*"
        - "* /proc/*/environ*"
        - "*curl*"
        - "*wget*"
        - "*nc *"
        - "*ncat*"
        - "*socat*"
        - "*dig *"
        - "*nslookup*"
        - "*ssh *"
        - "*scp *"
        - "*git push --force*"

    command_allowlist:
      - "kubectl get *"
      - "kubectl * get *"
      - "kubectl describe *"
      - "kubectl * describe *"
      - "kubectl logs *"
      - "kubectl * logs *"
      - "kubectl top *"
      - "kubectl * top *"
      - "kubectl events *"
      - "kubectl * events *"
      - "kubectl api-resources*"
      - "kubectl api-versions*"
      - "kubectl cluster-info*"
      - "kubectl version*"
      - "kubectl explain *"
      - "kubectl auth can-i *"
      - "kubectl rollout status *"
      - "kubectl * rollout status *"
      - "kubectl rollout history *"
      - "kubectl * rollout history *"

    checkpoints:
      enabled: true
      max_snapshots: 20

    plugins:
      enabled: []
      disabled: []

    web:
      search_backend: exa
      extract_backend: exa

    mcp_servers:
      exa:
        url: "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa"
        headers:
          x-api-key: "${EXA_API_KEY}"
        connect_timeout: 15
        timeout: 120
        tools:
          include:
            - web_search_exa
            - web_fetch_exa

    delegation:
      max_iterations: 20
      max_concurrent_children: 1
      max_spawn_depth: 1
      orchestrator_enabled: false
      subagent_auto_approve: false
      inherit_mcp_toolsets: false

    code_execution:
      timeout: 120
      max_tool_calls: 100

    stt:
      enabled: false

    privacy:
      redact_pii: true

    hooks_auto_accept: false
    timezone: America/Los_Angeles

    updates:
      pre_update_backup: false
      backup_keep: 5
      non_interactive_local_changes: discard
