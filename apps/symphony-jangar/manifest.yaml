apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: symphony-jangar
    app.kubernetes.io/part-of: lab
  name: symphony-jangar
  namespace: jangar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: symphony-jangar
      app.kubernetes.io/part-of: lab
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-27T21:16:35Z'
      labels:
        app.kubernetes.io/name: symphony-jangar
        app.kubernetes.io/part-of: lab
    spec:
      containers:
      - command:
        - sh
        - "-lc"
        - |
          export HOME="${HOME:-/workspace/.codex-home}"
          mkdir -p "$HOME/.codex"
          if [ ! -f "$HOME/.codex/auth.json" ] || ! cmp -s /var/run/codex-auth/auth.json "$HOME/.codex/auth.json"; then
            cp /var/run/codex-auth/auth.json "$HOME/.codex/auth.json"
            chmod 600 "$HOME/.codex/auth.json"
          fi
          exec bun src/index.ts /etc/symphony/WORKFLOW.md
        env:
        - name: LINEAR_API_KEY
          valueFrom:
            secretKeyRef:
              key: LINEAR_API_KEY
              name: symphony-linear-api-key-jangar
        - name: SYMPHONY_LEADER_ELECTION_LEASE_NAME
          value: symphony-jangar-leader
        - name: HOME
          value: "/workspace/.codex-home"
        - name: NODE_ENV
          value: production
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-token
              optional: true
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-token
              optional: true
        - name: SYMPHONY_LEADER_ELECTION_ENABLED
          value: 'true'
        - name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app.kubernetes.io/name']
        - name: OTEL_SERVICE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OTEL_SERVICE_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://observability-tempo-distributor.observability.svc.cluster.local:4318/v1/traces
        - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
          value: http://observability-mimir-gateway.observability.svc.cluster.local/otlp/v1/metrics
        - name: OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
          value: '20000'
        - name: OTEL_EXPORTER_OTLP_METRICS_TIMEOUT
          value: '20000'
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: '15000'
        - name: OTEL_METRIC_EXPORT_TIMEOUT
          value: '20000'
        - name: OTEL_LOGS_EXPORTER
          value: none
        image: registry.ide-newton.ts.net/lab/symphony:kargo-sha-b503deab769a67b10cb5cb3f77063b6e88582b5d@sha256:c57e2b8a3a7f79c930cd6ae5b8bcddf7856fd4fae7028218aef29dea6021b418
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: "/livez"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        name: symphony
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: "/readyz"
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: "/workspace"
          name: workspace
        - mountPath: "/etc/symphony/WORKFLOW.md"
          name: workflow
          readOnly: true
          subPath: WORKFLOW.md
        - mountPath: "/var/run/codex-auth/auth.json"
          name: codex-auth
          readOnly: true
          subPath: auth.json
      nodeSelector:
        kubernetes.io/arch: arm64
      serviceAccountName: symphony-jangar
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: symphony-workspace-jangar
      - configMap:
          name: symphony-workflow-jangar-9fcd5hd4dd
        name: workflow
      - name: codex-auth
        secret:
          secretName: codex-auth
