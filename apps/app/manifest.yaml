---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: app
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
spec:
  selector:
    matchLabels:
      app: app
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
        - name: HOSTNAME
          value: 0.0.0.0
        - name: NITRO_PORT
          value: '3000'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: app-db-app
        envFrom:
        - secretRef:
            name: app-env
        image: registry.ide-newton.ts.net/lab/app@sha256:2ff35a9e4e2d442da1d2585d6603c4a862e93aaa6ba36caeef0df05b786f70f3
        name: app
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-env
  namespace: app
spec:
  encryptedData:
    APP_BASE_URL: 
    APP_OIDC_CLIENT_ID: 
    APP_OIDC_CLIENT_SECRET: 
    APP_OIDC_ISSUER_URL: 
    BETTER_AUTH_SECRET: 
  template:
    metadata:
      name: app-env
      namespace: app
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: app
spec:
  bootstrap:
    initdb:
      dataChecksums: true
      database: app
      encoding: UTF8
      owner: app
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: pgadmin
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: pgadmin
  instances: 1
  monitoring:
    enablePodMonitor: true
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
    storageClass: rook-ceph-block
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: app
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`app.proompteng.ai`)
    services:
    - name: app
      port: 3000
  tls: {}
