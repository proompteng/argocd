apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tengri-gateway
  namespace: tengri
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`tengri.proompteng.ai`) && (Path(`/v1/terminal/ws`) || Path(`/v1/preview/open`)
      || Path(`/_tengri/open-preview.js`))
    middlewares:
    - name: tengri-rate-limit
    services:
    - name: tengri-gateway
      port: 8080
    syntax: v3
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tengri-preview
  namespace: tengri
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: HostRegexp(`^tengri-[a-z0-9]{24}\.proompteng\.ai$`)
    middlewares:
    - name: tengri-rate-limit
    services:
    - name: tengri-preview
      port: 8081
    syntax: v3
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tengri-rate-limit
  namespace: tengri
spec:
  rateLimit:
    average: 120
    burst: 180
    period: 1m
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
