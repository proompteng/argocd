apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/name: tengri
  name: tengri
  namespace: tengri
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
      app.kubernetes.io/name: tengri
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/name: tengri
        app.kubernetes.io/part-of: tengri
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: TENGRI_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TENGRI_GUEST_ARCHITECTURE
          value: amd64
        - name: TENGRI_DEFAULT_IMAGE
          valueFrom:
            configMapKeyRef:
              key: NANOAGENT_IMAGE
              name: tengri-release-5kf5fdkb76
        - name: TENGRI_PUBLIC_URL
          value: https://tengri.proompteng.ai
        - name: TENGRI_PREVIEW_URL_TEMPLATE
          value: https://tengri-{session}.proompteng.ai
        - name: TENGRI_DESKTOP_ORIGIN
          value: https://proompteng.ai
        - name: TENGRI_PREVIEW_ADDRESS
          value: 0.0.0.0:8081
        - name: TENGRI_RUNTIME_SECRET_DIRECTORY
          value: "/var/run/secrets/tengri-runtime"
        - name: TENGRI_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - secretRef:
            name: tengri-runtime
        image: registry.ide-newton.ts.net/lab/tengri@sha256:fed0617eaaa556a500d3b3d8831f84b1ec822ef47b3e82d36e9323e4e808b1e2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: "/livez"
            port: gateway
          periodSeconds: 15
          timeoutSeconds: 2
        name: tengri
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        - containerPort: 8080
          name: gateway
          protocol: TCP
        - containerPort: 8081
          name: preview
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: "/readyz"
            port: gateway
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: "/livez"
            port: gateway
          periodSeconds: 2
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: "/var/run/secrets/tengri-runtime"
          name: runtime-secret
          readOnly: true
        - mountPath: "/tmp"
          name: tmp
      enableServiceLinks: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: tengri
      terminationGracePeriodSeconds: 30
      volumes:
      - name: runtime-secret
        secret:
          secretName: tengri-runtime
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
