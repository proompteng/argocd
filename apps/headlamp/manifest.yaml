---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    headlamp.proompteng.ai/oidc-sealedsecret-sha: 4f3e015931e2b98851f3f9b8ad28fad04177fba38bfcf5ff7b50605726ccf8fd
  labels:
    app.kubernetes.io/instance: headlamp
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/version: 0.44.0
    helm.sh/chart: headlamp-0.44.0
  name: headlamp
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: headlamp
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: headlamp
        app.kubernetes.io/name: headlamp
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - "-in-cluster"
        - "-in-cluster-context-name=main"
        - "-plugins-dir=/headlamp/plugins"
        - "-oidc-client-id=$(OIDC_CLIENT_ID)"
        - "-oidc-client-secret=$(OIDC_CLIENT_SECRET)"
        - "-oidc-idp-issuer-url=$(OIDC_ISSUER_URL)"
        - "-oidc-scopes=$(OIDC_SCOPES)"
        - "-oidc-ca-file=/etc/ssl/certs/ca-certificates.crt"
        - "-oidc-use-access-token=$(OIDC_USE_ACCESS_TOKEN)"
        env:
        - name: OIDC_SCOPES
          value: openid,profile,email,offline_access
        - name: OIDC_USE_ACCESS_TOKEN
          value: 'true'
        envFrom:
        - secretRef:
            name: headlamp-oidc
        image: registry.ide-newton.ts.net/lab/headlamp@sha256:594cd781e4b15d1656997c3e51bc9c0a1a3fdd397fcee4f00087b000f0005471
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: "/"
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: headlamp
        ports:
        - containerPort: 4466
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: "/"
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          privileged: false
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 100
        volumeMounts:
        - mountPath: "/tmp"
          name: headlamp-tmp
      hostUsers: true
      securityContext:
        fsGroup: 101
      serviceAccountName: headlamp
      volumes:
      - emptyDir: {}
        name: headlamp-tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: headlamp-auth-bridge
    app.kubernetes.io/part-of: headlamp
  name: headlamp-auth-bridge
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-auth-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp-auth-bridge
        app.kubernetes.io/part-of: headlamp
    spec:
      containers:
      - command:
        - python
        - "-B"
        - "/app/server.py"
        env:
        - name: HEADLAMP_UPSTREAM_HOST
          value: headlamp
        - name: HEADLAMP_UPSTREAM_PORT
          value: '80'
        - name: HEADLAMP_PROXY_TIMEOUT_SECONDS
          value: '30'
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: http
        name: auth-bridge
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: http
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: "/app/auth.html"
          name: app
          readOnly: true
          subPath: auth.html
        - mountPath: "/app/server.py"
          name: app
          readOnly: true
          subPath: server.py
      securityContext:
        fsGroup: 101
      volumes:
      - configMap:
          items:
          - key: auth.html
            path: auth.html
          - key: server.py
            path: server.py
          name: headlamp-auth-bridge
        name: app
