---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workspace-cluster-admin
  namespace: froussard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: coder
  namespace: coder
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    serving.knative.dev/creator: system:serviceaccount:argocd:argocd-application-controller
    serving.knative.dev/lastModifier: system:serviceaccount:argocd:argocd-application-controller
    serving.knative.dev/revision-history-limit: '3'
  name: froussard
  namespace: froussard
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: '1'
        serving.knative.dev/revision-history-limit: '3'
    spec:
      containerConcurrency: 0
      containers:
      - env:
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: webhook-secret
              name: github-secret
        - name: LINEAR_WEBHOOK_ENABLED
          value: 'false'
        - name: KAFKA_BROKERS
          value: kafka-kafka-bootstrap.kafka:9092
        - name: KAFKA_TOPIC
          value: github.webhook.events
        - name: KAFKA_DISCORD_COMMAND_TOPIC
          value: discord.commands.incoming
        - name: KAFKA_USERNAME
          value: froussard
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: froussard
        - name: KAFKAJS_NO_PARTITIONER_WARNING
          value: '1'
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-token
        - name: DISCORD_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: public-key
              name: discord-bot
        - name: ATLAS_BASE_URL
          value: http://jangar.jangar.svc.cluster.local
        - name: AGENTS_SERVICE_BASE_URL
          value: http://agents.agents.svc.cluster.local
        - name: AGENTS_SERVICE_CLIENT_NAME
          value: froussard
        - name: OTEL_SERVICE_NAME
          value: froussard
        - name: OTEL_SERVICE_NAMESPACE
          value: froussard
        - name: FROUSSARD_VERSION
          value: kargo-sha-fe6c75754777e48e4ea9ee8f560e531a61e31643
        - name: FROUSSARD_COMMIT
          value: fe6c75754777e48e4ea9ee8f560e531a61e31643
        - name: LGTM_TEMPO_TRACES_ENDPOINT
          value: http://observability-tempo-gateway.observability.svc.cluster.local:4317
        - name: LGTM_MIMIR_METRICS_ENDPOINT
          value: http://jangar-alloy.jangar.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_METRICS_TIMEOUT
          value: '20000'
        - name: LGTM_LOKI_ENDPOINT
          value: http://observability-loki-loki-distributed-gateway.observability.svc.cluster.local/loki/api/v1/push
        image: registry.ide-newton.ts.net/lab/froussard@sha256:35489f090fa1b2b27516aa844c0e5edfbfad6d39033b63766c2cd56ae2e72ca1
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: "/health/liveness"
            port: http1
        name: app
        ports:
        - containerPort: 8080
          name: http1
        readinessProbe:
          httpGet:
            path: "/health/readiness"
            port: http1
          successThreshold: 1
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: arm64
      timeoutSeconds: 300
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: froussard
  namespace: istio-system
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`froussard.proompteng.ai`)
    middlewares:
    - name: froussard-knative-host
    services:
    - name: knative-local-gateway
      port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: froussard-knative-host
  namespace: istio-system
spec:
  headers:
    customRequestHeaders:
      Host: froussard.froussard.svc.cluster.local
